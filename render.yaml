services:
  - type: web
    name: tradeshark
    runtime: node
    plan: free
    region: oregon
    domains:
      - tradesharks.online
      - www.tradesharks.online
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: TradeShark
      - key: COMPANY_LEGAL_NAME
        value: TradeShark Ltd
      - key: APP_URL
        value: https://tradesharks.online
      - key: DATABASE_URL
        fromDatabase:
          name: tradeshark-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Shark@Admin2025!
      - key: ADMIN_EMAIL
        value: support@tradesharks.online
      - key: ADMIN_NAME
        value: System Administrator
      - key: ADMIN_NOTIFY_EMAIL
        value: support@tradesharks.online
      - key: LOGIN_OTP
        value: "true"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: MAX_FAILED_LOGINS
        value: "5"
      - key: LOCKOUT_MINUTES
        value: "15"
      - key: SHOW_ADMIN_LINK
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ENABLE_DEMO_LOGINS
        value: "false"
      - key: SIGNUP_BONUS
        value: "0"
      - key: MIN_DEPOSIT
        value: "100"
      - key: MIN_WITHDRAWAL
        value: "50"
      - key: SUPPORT_EMAIL
        value: support@tradesharks.online
      - key: MAIL_FROM_NAME
        value: TradeShark
      - key: MAIL_FROM_ADDRESS
        value: support@tradesharks.online
      - key: MAIL_REPLY_TO
        value: support@tradesharks.online
      - key: EMAIL_TRADE_CONFIRMATIONS
        value: "true"
      - key: EMAIL_LOGIN_ALERTS
        value: "false"
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: tradeshark-db
    databaseName: tradeshark
    user: tradeshark
    plan: free
    region: oregon
